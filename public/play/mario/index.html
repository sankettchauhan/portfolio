
<!DOCTYPE html>

<html>

<head>
  <title>Mario</title>
  <meta charset="utf-8">
  <style>
    * {
      margin: 0;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>

<body>
<script src="../lib/kaboom-0.5.0.js"></script>
<script src="../lib/kaboom-0.5.0-aseprite.js"></script>
<script src="../lib/kaboom-0.5.0-pedit.js"></script>
<script src="../lib/kaboom-legacy-kbmsprite.js"></script>

  <script>

kaboom({
  ...{"fullscreen":true,"width":240,"height":240,"scale":2,"startScene":"main","version":"0.5.0","clearColor":[0,0,0,1]},
  // Portfolio port: scale to the window so the level (~200 units tall) fills it.
  scale: Math.max(1, Math.floor((innerHeight / 260) * 4) / 4),
  global: true,
  plugins: [ peditPlugin, asepritePlugin, kbmspritePlugin ],
});
loadSprite("block", "sprites/block.png");
loadSprite("blue-block", "sprites/blue-block.png");
loadSprite("blue-brick", "sprites/blue-brick.png");
loadSprite("blue-evil-shroom", "sprites/blue-evil-shroom.png");
loadSprite("blue-steel", "sprites/blue-steel.png");
loadSprite("blue-surprise", "sprites/blue-surprise.png");
loadSprite("brick", "sprites/brick.png");
loadSprite("coin", "sprites/coin.png");
loadSprite("evil-shroom-1", "sprites/evil-shroom-1.png");
loadSprite("mario-standing", "sprites/mario-standing.png");
loadSprite("mushroom", "sprites/mushroom.png");
loadSprite("pipe-left", "sprites/pipe-left.png");
loadSprite("pipe-right", "sprites/pipe-right.png");
loadSprite("pipe-top-left-side", "sprites/pipe-top-left-side.png");
loadSprite("pipe-top-right-side", "sprites/pipe-top-right-side.png");
loadSprite("question", "sprites/question.png");
loadSprite("unboxed", "sprites/unboxed.png");
scene("lose", (args = {}) => {
camPos(width() / 2, height() / 2)
add([text("GAME OVER", 16), origin('center'), pos(width() / 2, height() / 2 - 36), color(1, 0.35, 0.35)])
add([text("score " + (args.score ?? 0), 10), origin('center'), pos(width() / 2, height() / 2)])
const hint = add([text("press space to play again", 6), origin('center'), pos(width() / 2, height() / 2 + 36)])
const shownAt = time()
// Ignore presses in the first 0.6s so the jump/kaboom that ended the run
// doesn't instantly restart it.
keyPress('space', () => { if (time() - shownAt > 0.6) go('main', { level: 0, score: 0 }) })
loop(0.5, () => { hint.hidden = !hint.hidden })
});
scene("main", (args = {}) => {
const MOVE_SPEED = 120
const JUMP_FORCE = 360
const BIG_JUMP_FORCE = 550
let CURRENT_JUMP_FORCE = JUMP_FORCE
const ENEMY_SPEED = 20
const FALL_DEATH = 600

let isJumping = true


layers(['obj', 'ui'], 'obj')
camIgnore(['ui'])

const maps = [
  [
    '                              ',
    '                              ',
    '                              ',
    '                              ',
    '                              ',
    '    %   =*=%=                 ',
    '                              ',
    '                      -+      ',
    '             ^   ^    ()      ',
    'xxxxxxxxxxxxxxxxxxxxxxxx    xx',
  ], [
    '£                              £',
    '£                              £',
    '£                              £',
    '£        @@@@@      s          £',
    '£                 s s s        £',
    '£               s s s s s    -+£',
    '£      !      s s s s s s    ()£',
    'zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz',
  ]
]


const levelCfg = {
  width: 20,
  height: 20,
  '=' : [sprite('block'), solid()],
  'x' : [sprite('brick'), solid()],
  '$' : [sprite('coin'), 'coin'],
  '%' : [sprite('question'), 'coin-surprise', solid()],
  '*' : [sprite('question'), 'mushroom-surprise', solid()],   
  '}' : [sprite('unboxed'), solid()], 
  '(' : [sprite('pipe-left'), scale(0.5), solid()],
  ')' : [sprite('pipe-right'), scale(0.5), solid()], 
  '-' : [sprite('pipe-top-left-side'), scale(0.5), solid(), 'pipe'],
  '+' : [sprite('pipe-top-right-side'), scale(0.5), solid(), 'pipe'], 
  '^' : [sprite('evil-shroom-1'), solid(), 'dangerous'], 
  '#' : [sprite('mushroom'), 'mushroom', body()], 
  '£' : [sprite('blue-brick'), solid(),scale(0.5)],
  'z' : [sprite('blue-block'), solid(), scale(0.5)], 
  '@' : [sprite('blue-surprise'), solid(), scale(0.5), 'coin-surprise'],
  '!' : [sprite('blue-evil-shroom'), 'dangerous', scale(0.5)],
  's' : [sprite('blue-steel'), solid(), scale(0.5)],  
}

const levelIndex = args.level ?? 0 
const gameLevel = addLevel(maps[levelIndex], levelCfg)

const scoreGlobal = args.score ?? 0
const scoreLabel = add([
  text(scoreGlobal),
  pos(8, 20),
  layer('ui'),
  {
    value: scoreGlobal,
  }
])

add([text('level ' + parseInt(levelIndex + 1)), pos(8, 8), layer('ui')])

function big() {
  let timer = 0
  let isBig = false
  return {
    update() {
      if (isBig) {
        timer -=dt()
        if (timer <=0) {
          this.smallify()
        }
      }
    },
    isBig() {
      return isBig
    },
    smallify() {
      this.scale = vec2(1)
      timer = 0
      isBig = false
      CURRENT_JUMP_FORCE = JUMP_FORCE
    },
    biggify(time) {
      this.scale = vec2(2)
      timer = time
      isBig = true
      CURRENT_JUMP_FORCE = BIG_JUMP_FORCE
    }
  }
}

const player = add([
  sprite('mario-standing'),
  pos(30,0),
  body(),
  big(),
  origin('bot')
])

player.collides('dangerous', (d) => {
  if(isJumping) {
    destroy(d)
  } else {
     go('lose', { score: scoreLabel.value}) 
  }
})

player.action(() => {
  camPos(player.pos.add(5))
  if (player.pos.y >= FALL_DEATH) {
    go('lose', { score: scoreLabel.value })
  }
})

keyDown('left', () => {
  player.move(-MOVE_SPEED, 0)
})

keyDown('right', () => {
  player.move(MOVE_SPEED, 0)
})

player.action(() => {
  if(player.grounded()) {
    isJumping = false
  }
})

keyPress('space', () => {
  if(player.grounded())
  isJumping = true
  player.jump(CURRENT_JUMP_FORCE)
})

player.on('headbump', (obj) => {
  if(obj.is('coin-surprise')) {
    gameLevel.spawn('$', obj.gridPos.sub(0,1))
    destroy(obj)
    gameLevel.spawn('}', obj.gridPos.sub(0,0))
  }
  if(obj.is('mushroom-surprise')) {
    gameLevel.spawn('#', obj.gridPos.sub(0,1))
    destroy(obj)
    gameLevel.spawn('}', obj.gridPos.sub(0,0))
  }
})

action('mushroom', (m) => {
  m.move(20, 0)
})

player.collides('mushroom', (m) => {
  player.biggify(6)
  destroy(m)
})

player.collides('coin', (c) => {
  scoreLabel.value++
  scoreLabel.text = scoreLabel.value
  destroy(c)
})

action('dangerous', (d) => {
  d.move(-ENEMY_SPEED,0)
})

player.collides('pipe', () => {
  keyPress('down', () => {
    go('main', {
      level: (levelIndex + 1) % maps.length,
      score: scoreLabel.value
    })
  })
})




});
start("main");

  </script>
</body>

</html>
